[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-case-pipeline"
version = "0.1.0"
description = "Clinical case extraction pipeline (provider-agnostic LLM + accuracy harness)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Provider SDK isolated in the Vertex adapter (INV-6)"
type = "forbidden"
source_modules = [
    "app.schema",
    "app.extract",
    "app.client.base",
    "app.client.mock",
    "app.harness",
]
forbidden_modules = ["google", "vertexai"]
